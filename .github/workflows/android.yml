name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "Looks/**"
      - "Brand/**"
      - "Content/**"
      - "App/Localizable.xcstrings"
      - ".github/workflows/android.yml"
  push:
    branches: [main]

jobs:
  android:
    name: Android core tests and app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared assets are in sync
        run: python3 tools/sync_android_assets.py --check
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test -Paurum.includeApp=false
      - name: App build
        run: ./gradlew :app:assembleDebug -Paurum.includeApp=true
